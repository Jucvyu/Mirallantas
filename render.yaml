# Blueprint de Render para la API de MiraLlantas (opcional: también se puede
# crear el servicio a mano con estos mismos valores).
# Los valores con "sync: false" se escriben en el panel de Render al crear
# el servicio: son secretos o dependen de tu cuenta y nunca van en el repo.
services:
  - type: web
    name: mirallantas-api
    runtime: node
    # Plan gratis (sin tarjeta). Sin esta línea Render usa Starter, que es de pago.
    plan: free
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/salud
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: APP_TIMEZONE
        value: America/Bogota
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: EXIGIR_2FA_ADMIN
        value: "false"
      - key: CORS_ORIGINS
        value: https://mirallantas.vercel.app
      - key: DATABASE_SSL
        value: no-verify
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLAVE_CIFRADO
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: CORREO_REMITENTE
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
