<!doctype html>
<html lang="es-CO">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MiraLlantas · Venta de llantas y reencauche</title>

    <!-- Buscadores: qué es el sitio y para quién -->
    <meta
      name="description"
      content="MiraLlantas: venta de llantas para camión, bus y vehículo particular, y servicio de reencauche. Cotiza en línea, paga de contado o a crédito y sigue tus pedidos desde el portal de clientes."
    />
    <meta
      name="keywords"
      content="llantas, reencauche, llantas para camión, llantas para bus, reencauche en frío, cotizar llantas, llantas a crédito, Colombia"
    />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0B1220" />
    <meta name="application-name" content="MiraLlantas" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Vista previa al compartir el enlace (WhatsApp, Facebook, LinkedIn…) -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_CO" />
    <meta property="og:site_name" content="MiraLlantas" />
    <meta property="og:title" content="MiraLlantas · Venta de llantas y reencauche" />
    <meta
      property="og:description"
      content="Cotiza llantas y reencauche en línea, paga de contado o a crédito y sigue tus pedidos."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="MiraLlantas · Venta de llantas y reencauche" />
    <meta
      name="twitter:description"
      content="Cotiza llantas y reencauche en línea, paga de contado o a crédito y sigue tus pedidos."
    />

    <!-- Seguridad: el sitio nunca envía la dirección completa a otros sitios -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Datos estructurados: le dicen a Google que es un negocio -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "AutoPartsStore",
        "name": "MiraLlantas",
        "description": "Venta de llantas y servicio de reencauche.",
        "areaServed": "CO"
      }
    </script>
  </head>
  <body>
    <noscript>MiraLlantas necesita JavaScript activado para funcionar.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
